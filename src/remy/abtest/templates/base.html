<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recipe taste study{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <span class="brand">Remy <span>· recipe taste study</span></span>
      {% block steps %}{% endblock %}
    </div>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <script>
    // Descriptions show 3 lines; the cut-off ones reveal the full text on hover, tap or focus.
    document.querySelectorAll(".desc-wrap").forEach(wrap => {
      const desc = wrap.querySelector(".desc");
      if (desc.scrollHeight > desc.clientHeight + 1) {
        wrap.classList.add("truncated");
        wrap.tabIndex = 0;
        wrap.setAttribute("aria-label", "Show full description");
        wrap.querySelector(".desc-full").removeAttribute("aria-hidden");
      }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
