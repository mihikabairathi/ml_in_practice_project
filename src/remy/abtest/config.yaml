# Blind A/B survey settings. Override the path with REMY_ABTEST_CONFIG=/path/to/file.yaml.

# Models are fit on reviews dated before this day and recipes submitted before it.
# Must be on or before the last RollingSplits window end (2016-01-01).
train_cutoff: 2016-01-01

# Relative paths resolve from the repository root.
responses_path: data/processed/abtest/responses.jsonl   # one JSON line per completed survey
model_cache_dir: data/processed/abtest/models

survey:
  n_quiz: 5                     # cold-start recipes the participant rates
  n_recs: 10                    # recipes shown in each of the two lists
  quiz_pool_size: 300           # quiz recipes are sampled from the top-N most reviewed,
                                # after skipping the n_recs most reviewed (popularity's picks)
  show_community_stats: false   # average rating / review count on cards (hints at popularity)
  ask_preference: true          # final "which list would you rather cook from?"

# Exactly two models, a and b. These keys are internal labels; participants only
# see "List 1" / "List 2", and which model goes on the left is random per participant.
# `type` is a key of remy.abtest.models.MODELS; `params` go to the model constructor.
models:
  a:
    type: popularity
    params: {}
  b:
    type: lightgbm
    params: {}                  # defaults: all feature groups; trains on all quarters before train_cutoff
