[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remy"
version = "0.1.0"
description = "Food.com exploratory analysis and recipe recommendation experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pandas>=3.0,<3.1",
    "matplotlib>=3,<4",
    "pyarrow>=25,<26",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "torch>=2,<3",
    "kagglehub>=1.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
