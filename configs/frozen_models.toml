# Five non-LLM winners from Initial ML Solution.pdf (pp. 7-9, 12-14),
# plus the later XGBoost winner from reports/tree_comparison/README.md.
# These are fixed configurations, not a search space. Reference scores are
# rounded validation means from the sources, not acceptance thresholds.
schema_version = 1
description = "Submitted assignment configurations plus selected XGBoost; LLM omitted"

[evaluation]
split = "val"
candidate_k = 1000
save_top_k = 100

[embeddings]
directory = "data/processed/embeddings/minilm_joint"
# Generated by scripts/embed_recipes.py with all-MiniLM-L6-v2.

[models.popularity]
type = "popularity"
label = "Popularity baseline"
source = "Initial ML Solution.pdf, Part 5, p. 13"
notes = "All historical review counts; all ratings contribute. No fitted hyperparameters."
params = {}
reference_val = { recall10 = 0.0157, hr10 = 0.0398, recall100 = 0.0703, hr100 = 0.1604, ndcg = 0.1251 }

[models.embedding]
type = "embedding"
label = "Frozen MiniLM (centered)"
source = "Initial ML Solution.pdf, pp. 11-13; notebooks/rolling_embedding.ipynb"
notes = "Equal name/ingredient cosine; available-catalog centering; all historical likes weighted 5 stars = 1, 4 stars = 0.5."
reference_val = { recall10 = 0.0068, hr10 = 0.0187, recall100 = 0.0452, hr100 = 0.1154, ndcg = 0.11897 }
[models.embedding.params]
method = "centered"
n_candidates = 1000
rating_weights = { "5" = 1.0, "4" = 0.5 }
history_k = 3 # Inactive for the centered method.

[models.embedding_trained]
type = "embedding_trained"
label = "Frozen MiniLM + trained towers"
source = "Initial ML Solution.pdf, pp. 12-13; notebooks/rolling_embedding_training.ipynb"
notes = "Joint name+ingredient embeddings; likes weighted 5 stars = 1, 4 stars = 0.5; AdamW weight decay 0.0001; five negatives from a 10,000-item historical popularity pool (existing training_examples helper)."
reference_val = { recall10 = 0.0145, hr10 = 0.0387, recall100 = 0.0702, hr100 = 0.1651, ndcg = 0.12487 }
[models.embedding_trained.params]
variant = "softmax"
loss = "softmax"
architecture = "nonlinear"
width = 128
learning_rate = 0.001
epochs = 15
batch_size = 512
seed = 10718
n_candidates = 1000

[models.lightgbm]
type = "lightgbm"
label = "LightGBM (submitted report)"
source = "Initial ML Solution.pdf, pp. 8-9, 13-14; round-one all-features row"
notes = "Explicit round-one feature list: excludes later season/trend/five-star feature groups and MiniLM. Constructor defaults have since expanded."
reference_val = { recall10 = 0.0167, hr10 = 0.0431, recall100 = 0.0791, hr100 = 0.1798, ndcg = 0.1267 }
[models.lightgbm.params]
feature_groups = ["user_base", "tags", "user_activity", "user_taste", "recipe_pop", "recipe_rating", "recipe_static", "inter_tag", "inter_diff"]
objective = "binary"
negatives_per_positive = 10
hard_negative_frac = 0.0
n_candidates = 1000
num_boost_round = 200
learning_rate = 0.05
num_leaves = 31
min_data_in_leaf = 100
max_depth = -1
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0
lambda_l1 = 0.0
lambda_l2 = 0.0
min_tag_count = 1
liked_min_rating = 4
prior_strength = 10
filter_seen_positives = false
seed = 10718
num_threads = 4 # Runtime choice; report does not prescribe thread count.

[models.knn]
type = "knn"
label = "KNN + popularity"
source = "Initial ML Solution.pdf, pp. 7-8; implementation recovered from commit b61173a"
notes = "Report beta=0.1 takes precedence over the branch's later default 0.05. Cosine is shrunk by co-likes/(co-likes+20); CF and log-popularity scores are individually max-normalized per user's shortlist. Five-star threshold follows the existing baseline."
reference_val = { recall10 = 0.0158, hr10 = 0.0404, recall100 = 0.0695, hr100 = 0.1608, ndcg = 0.1251 }
[models.knn.params]
k_neighbors = 300
n_candidates = 1000
min_rating = 5.0
shrinkage = 20.0
cf_weight = 0.1

[models.xgboost]
type = "xgboost"
label = "XGBoost + MiniLM"
source = "reports/tree_comparison/README.md; selected depth-five configuration"
notes = "Later addition, absent from the submitted assignment. Binary logistic histogram trees; same MiniLM inputs as the embedding models."
reference_val = { recall10 = 0.01861, hr10 = 0.0478, recall100 = 0.0850, hr100 = 0.1913, ndcg = 0.1283 }
[models.xgboost.params]
feature_groups = ["user_base", "tags", "recipe_pop", "pop_season", "pop_trend", "pop_5star", "user_taste", "inter_tag"]
n_candidates = 1000
negatives_per_positive = 10
hard_negative_frac = 0.0
seed = 10718
num_threads = 4
num_boost_round = 120
max_depth = 5
learning_rate = 0.0822948425999282
min_child_weight = 5.7853773583089464
subsample = 0.8853370472924392
colsample_bytree = 0.6526173563026589
reg_lambda = 1.0971159919250149
